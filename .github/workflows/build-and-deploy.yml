name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php_version: ["8.3", "8.2", "8.1", "7.4"]
        ubuntu_version: ["24.04", "22.04"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./build
          file: ./build/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USER }}/php:${{ matrix.php_version }}-ubuntu${{ matrix.ubuntu_version }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}

  update-coder-template:
    runs-on: ubuntu-latest
    needs: build-and-push-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Coder CLI
        run: |
          curl -fsSL https://coder.com/install.sh | sh

      - name: Log in to Coder
        run: coder login --token ${{ secrets.CODER_TOKEN }} --yes --url https://embold.dev --no-version-warning

      - name: Push PHP Template
        run: coder template push php --yes
