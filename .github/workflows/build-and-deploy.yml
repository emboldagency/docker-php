name: Build and Deploy PHP

on:
  push:
    branches: # Added this to keep cache warm on main commits
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]"
  workflow_dispatch:
    inputs:
      skip-jobs:
        description: "Space-separated list of jobs to skip"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LATEST_UBUNTU: "24.04"
  LATEST_PHP: "8.3"

jobs:
  initialization:
    runs-on: ubuntu-latest
    outputs:
      skip-build: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.inputs['skip-jobs'] }}" == *"build-and-push-docker"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-and-push-docker:
    needs: initialization
    if: needs.initialization.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.4", "8.3", "8.2", "8.1", "7.4"]
        ubuntu_version: ["24.04"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.php_version }}-ubuntu${{ matrix.ubuntu_version }}
            type=semver,pattern=${{ matrix.php_version }}-ubuntu${{ matrix.ubuntu_version }}-release{{version}}
            type=raw,value=latest,enable=${{ matrix.php_version == env.LATEST_PHP && matrix.ubuntu_version == env.LATEST_UBUNTU }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          cache-from: type=gha,scope=php-${{ matrix.php_version }}-ubuntu-${{ matrix.ubuntu_version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_version }}-ubuntu-${{ matrix.ubuntu_version }}

  update-coder-template:
    needs: [initialization, build-and-push-docker]
    if: ${{ !cancelled() && !contains(github.event.inputs['skip-jobs'], 'update-coder-template') && (needs.initialization.outputs.skip-build == 'true' || needs.build-and-push-docker.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Coder
        uses: coder/setup-action@v1
        with:
          access_url: https://embold.dev
          coder_session_token: ${{ secrets.CODER_TOKEN }}

      - name: Push Coder Template
        env:
          # Map the secret to a shell variable to avoid injection/escaping issues
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          # Debug: Print length to confirm it's not empty
          echo "Token length: ${#GHCR_TOKEN}"
          if [ "${#GHCR_TOKEN}" -eq 0 ]; then
            echo "Error: GHCR_TOKEN secret is empty! Check Repo Settings."
            exit 1
          fi

          coder templates push php \
            --directory . \
            --name "${{ github.ref_name }}" \
            --message "Release: ${{ github.ref_name }}" \
            --var "GHP_REGISTRY_PASS=${GHCR_TOKEN}" \
            --activate=false \
            --yes
