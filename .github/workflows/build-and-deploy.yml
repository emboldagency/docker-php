name: Build and Deploy PHP

on:
  push:
    tags:
      # Match a tag with the format v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]"
  workflow_dispatch:
    inputs:
      skip-jobs:
        description: "Space-separated list of jobs to skip"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Define the "Golden Path" version that gets the 'latest' tag
  LATEST_UBUNTU: "24.04"
  LATEST_PHP: "8.3"

jobs:
  initialization:
    runs-on: ubuntu-latest
    outputs:
      skip-build: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.inputs['skip-jobs'] }}" == *"build-and-push-docker"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-and-push-docker:
    needs: initialization
    if: needs.initialization.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # Don't stop all jobs if one PHP version fails
      matrix:
        php_version: ["8.4", "8.3", "8.2", "8.1", "7.4"]
        ubuntu_version: ["24.04"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. Standard Matrix Tag: 8.3-ubuntu24.04
            type=raw,value=${{ matrix.php_version }}-ubuntu${{ matrix.ubuntu_version }}

            # 2. Release Tag: 8.3-ubuntu24.04-release1.7.0
            # Use semver to strip the 'v' from the tag so it matches Terraform
            type=semver,pattern=${{ matrix.php_version }}-ubuntu${{ matrix.ubuntu_version }}-release{{version}}

            # 3. Global "latest" (Only for the golden path combination)
            type=raw,value=latest,enable=${{ matrix.php_version == env.LATEST_PHP && matrix.ubuntu_version == env.LATEST_UBUNTU }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          # Matrix-Scoped Caching
          cache-from: type=gha,scope=php-${{ matrix.php_version }}-ubuntu-${{ matrix.ubuntu_version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_version }}-ubuntu-${{ matrix.ubuntu_version }}

  update-coder-template:
    needs: [initialization, build-and-push-docker]
    # Logic: Run if NOT skipped AND (Init said skip build OR build succeeded)
    if: ${{ !contains(github.event.inputs['skip-jobs'], 'update-coder-template') && (needs.initialization.outputs.skip-build == 'true' || needs.build-and-push-docker.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Coder CLI
      - name: Setup Coder
        uses: coder/setup-action@v1
        with:
          access_url: https://embold.dev
          coder_session_token: ${{ secrets.CODER_TOKEN }}

      # Push Coder Template
      - name: Push Coder Template
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "Token length: ${#GHCR_TOKEN}"
          if [ "${#GHCR_TOKEN}" -eq 0 ]; then
            echo "Error: GHCR_TOKEN secret is empty! Check Repo Settings."
            exit 1
          fi

          # 2. Create a temporary tfvars file
          # This bypasses shell quoting issues completely
          echo "GHP_REGISTRY_PASS=\"$GHCR_TOKEN\"" > secrets.auto.tfvars

          # 3. Push the template
          coder templates push php \
            --directory . \
            --name "${{ github.ref_name }}" \
            --message "Release: ${{ github.ref_name }}" \
            --activate=false \
            --yes
          
          # 4. Cleanup
          rm secrets.auto.tfvars