# Log all errors to the specified error log file
# https://httpd.apache.org/docs/current/mod/core.html#errorlog
ErrorLog ${APACHE_LOG_DIR}/apache_error.log

# Log all requests to the specified access log file
# https://httpd.apache.org/docs/current/mod/mod_log_config.html#globallog
GlobalLog ${APACHE_LOG_DIR}/apache_access.log combined

# Set the verbosity level of error messages
# https://httpd.apache.org/docs/current/mod/core.html#loglevel
LogLevel warn

# Specify the server name to avoid warnings about the server's hostname
# https://httpd.apache.org/docs/current/mod/core.html#servername
ServerName localhost

# This directive configures what you return as the Server HTTP response
# Header. The default is 'Full' which sends information about the OS-Type
# and compiled in modules.
# https://httpd.apache.org/docs/current/mod/core.html#servertokens
ServerTokens Full

# The ServerSignature directive allows the configuration of a trailing 
# footer line under server-generated documents 
# (error messages, mod_proxy ftp directory listings, mod_info output, ...).
# https://httpd.apache.org/docs/current/mod/core.html#serversignature
ServerSignature On

<Directory /home/embold/code >
    # Allow the use of .htaccess files for overriding settings
    # https://httpd.apache.org/docs/current/mod/core.html#allowoverride
    AllowOverride All

    # Enable directory indexing and symbolic link following
    # https://httpd.apache.org/docs/current/mod/core.html#options
    Options Indexes FollowSymLinks

    # Allow access to all users
    # https://httpd.apache.org/docs/current/mod/mod_authz_core.html#require
    Require all granted
</Directory>