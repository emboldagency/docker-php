name: Build and Deploy PHP

on:
  push:
    branches:
      - main # keeps the registry cache warm
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      skip-jobs:
        description: "Space-separated jobs to skip: build-and-push-docker, update-coder-template"
        required: false
        default: ""

jobs:
  build:
    uses: emboldagency/.github/.github/workflows/docker-build.yml@master
    permissions:
      contents: read
      packages: write
    with:
      language: php
      versions: '["8.5", "8.4", "8.3", "8.2", "8.1", "7.4"]'
      ubuntu_versions: '["26.04", "24.04"]'
      latest_version: "8.5"
      latest_ubuntu: "26.04"
      coder_template: php
      skip_jobs: ${{ inputs.skip-jobs || '' }}
    secrets: inherit
