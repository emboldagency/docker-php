; priority=30

; Set the default timezone for date/time functions
; https://www.php.net/date.timezone
date.timezone = UTC

; Display errors directly in the browser
; https://www.php.net/display-errors
display_errors = On

; Specify the error log file location
; https://www.php.net/error-log
error_log = ${APACHE_LOG_DIR}/php.log

; Display all errors, warnings, and notices during development
; https://www.php.net/error-reporting
error_reporting = E_ALL

; Log errors to a specific file for debugging purposes
; https://www.php.net/log-errors
log_errors = On

; Maximum execution time of each script, in seconds
; https://www.php.net/max-execution-time
max_execution_time = 3000

; Maximum amount of time each script may spend parsing request data.
; https://www.php.net/max-input-time
max_input_time = 3000

; Maximum amount of memory a script may consume
; https://www.php.net/memory-limit
memory_limit = 1128M

; Log errors to the specified file for opcache
; https://www.php.net/manual/en/opcache.configuration.php#ini.opcache.error-log
opcache.error_log = ${APACHE_LOG_DIR}/opcache.log

; Maximum size of POST data that PHP will accept.
; https://www.php.net/post-max-size
post_max_size = 800M

; Maximum size of POST data that PHP will accept.
; https://www.php.net/post-max-size
post_max_size = 800M

; Maximum number of files that can be uploaded via a single request
; https://www.php.net/manual/en/ini.core.php#ini.max-file-uploads
max_file_uploads = 300

; Maximum allowed size for uploaded files.
; https://www.php.net/upload-max-filesize
upload_max_filesize = 2000M

; Enable color var_dumps and stack traces output when in CLI mode and when the output is a tty
; https://xdebug.org/docs/all_settings#cli_color
xdebug.cli_color = 1

; Specify the log file for Xdebug (useful for debugging Xdebug itself)
; https://xdebug.org/docs/all_settings#log
xdebug.log = ${APACHE_LOG_DIR}/xdebug.log

; Enable Xdebug for debugging and profiling
; https://xdebug.org/docs/all_settings#mode
xdebug.mode = debug,develop

; Increase the maximum nesting level for Xdebug (useful for deep recursion debugging)
; https://xdebug.org/docs/all_settings#max_nesting_level
xdebug.max_nesting_level = 512

; Automatically start Xdebug remote debugging for every request
; https://xdebug.org/docs/all_settings#start_with_request
xdebug.start_with_request = yes